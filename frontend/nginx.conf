server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Assets con hash en el nombre (JS/CSS/imagenes) -> cache agresivo, nunca cambian de contenido
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html nunca se cachea: siempre tiene que traer la ultima version (referencia a los assets con hash actuales)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA: cualquier ruta que no sea un archivo real cae en index.html (React Router la maneja)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
